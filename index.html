<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LINE</title>
<style>
:root {
  --line-green: #06C755;
  --line-green-dark: #05a847;
  --line-bg: #f0f0f0;
  --line-header: #ffffff;
  --line-bubble-me: #06C755;
  --line-bubble-other: #ffffff;
  --line-text: #1e1e1e;
  --line-sub: #888888;
  --line-border: #e0e0e0;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #000; }
body {
  font-family: -apple-system, "Noto Sans TC", "Helvetica Neue", sans-serif;
  font-size: 15px;
  color: var(--line-text);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* 手機外框 */
#phone-frame {
  width: 100%;
  max-width: 390px;
  height: 100vh;
  max-height: 844px;
  background: var(--line-bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ── Status Bar ── */
#status-bar {
  background: white;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  font-size: 12px;
  font-weight: 600;
}
#status-bar .time { font-size: 15px; font-weight: 700; }
#status-bar .icons { display: flex; gap: 6px; align-items: center; font-size: 13px; }

/* ── Chat Header ── */
#chat-header {
  background: white;
  border-bottom: 0.5px solid var(--line-border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
#chat-header .back { font-size: 22px; color: var(--line-green); cursor: pointer; }
#chat-header .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  position: relative;
}
#chat-header .avatar .online {
  position: absolute; bottom: 1px; right: 1px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--line-green); border: 2px solid white;
}
#chat-header .info { flex: 1; }
#chat-header .name { font-size: 15px; font-weight: 600; }
#chat-header .status { font-size: 12px; color: var(--line-sub); }
#chat-header .actions { display: flex; gap: 16px; color: var(--line-sub); font-size: 20px; }

/* ── 數值列（偽裝成置頂公告）── */
#notice-bar {
  background: #fffbe6;
  border-bottom: 0.5px solid #f0d060;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #7a6500;
  flex-shrink: 0;
}
#notice-bar .notice-icon { font-size: 13px; }
#notice-bar .stats {
  display: flex; gap: 10px; flex: 1; justify-content: space-around;
}
.stat-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.stat-item .slabel { font-size: 10px; color: #999; }
.stat-item .sbar {
  width: 48px; height: 4px;
  background: #e0e0e0; border-radius: 2px; overflow: hidden;
}
.stat-item .sbar-fill {
  height: 100%; border-radius: 2px;
  transition: width 0.4s ease, background 0.4s;
}
.stat-item .sval { font-size: 10px; font-weight: 600; }

/* ── Chat Messages ── */
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  -webkit-overflow-scrolling: touch;
}
#chat-messages::-webkit-scrollbar { display: none; }

.date-divider {
  text-align: center;
  font-size: 11px;
  color: var(--line-sub);
  margin: 8px 0;
  background: rgba(0,0,0,0.06);
  border-radius: 10px;
  padding: 3px 10px;
  display: inline-block;
  align-self: center;
}

/* 訊息群組 */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 2px;
}
.msg-row.me { flex-direction: row-reverse; }
.msg-row.other { flex-direction: row; }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; align-self: flex-end;
}
.msg-avatar.hidden { visibility: hidden; }

.msg-content { max-width: 72%; display: flex; flex-direction: column; }
.msg-row.me .msg-content { align-items: flex-end; }
.msg-row.other .msg-content { align-items: flex-start; }

.msg-name { font-size: 11px; color: var(--line-sub); margin-bottom: 3px; padding-left: 2px; }

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
  position: relative;
  max-width: 100%;
}
.msg-row.me .bubble {
  background: var(--line-bubble-me);
  color: white;
  border-bottom-right-radius: 4px;
}
.msg-row.other .bubble {
  background: var(--line-bubble-other);
  color: var(--line-text);
  border-bottom-left-radius: 4px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}

.msg-meta {
  display: flex; align-items: center; gap: 4px;
  margin-top: 3px; font-size: 11px; color: var(--line-sub);
}
.msg-row.me .msg-meta { flex-direction: row-reverse; }
.read-label { color: var(--line-green); font-size: 10px; }

/* 系統訊息 */
.sys-msg {
  text-align: center; font-size: 11px; color: var(--line-sub);
  background: rgba(0,0,0,0.06); border-radius: 10px;
  padding: 4px 12px; align-self: center; margin: 4px 0;
}
.event-msg {
  text-align: center; font-size: 12px; color: #e85d04;
  background: #fff3e0; border-radius: 10px;
  padding: 6px 14px; align-self: center; margin: 6px 0;
  border: 1px solid #ffcc80;
}

/* 打字泡泡 */
.typing-bubble {
  background: white; border-radius: 18px; border-bottom-left-radius: 4px;
  padding: 12px 16px; display: flex; gap: 4px; align-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.08);
}
.typing-dot {
  width: 7px; height: 7px; border-radius: 50%; background: #bbb;
  animation: tdot 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* ── Input Bar ── */
#input-bar {
  background: white;
  border-top: 0.5px solid var(--line-border);
  padding: 8px 12px;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  flex-shrink: 0;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
}
#input-bar .icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; color: var(--line-sub);
  flex-shrink: 0;
}
#msg-input {
  flex: 1;
  border: 1px solid var(--line-border);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
  background: #f8f8f8;
  color: var(--line-text);
}
#msg-input:focus { border-color: #ccc; background: white; }
#msg-input:disabled { opacity: 0.5; }
#send-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--line-green);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: white; flex-shrink: 0;
  transition: background 0.2s;
}
#send-btn:hover { background: var(--line-green-dark); }
#send-btn:disabled { background: #ccc; cursor: default; }

/* ── 開始畫面（聊天列表）── */
#start-screen {
  position: absolute; inset: 0;
  background: white; z-index: 100;
  display: flex; flex-direction: column;
}
#start-header {
  background: white;
  padding: 44px 16px 12px;
  border-bottom: 0.5px solid var(--line-border);
}
#start-header h1 { font-size: 22px; font-weight: 700; }
#start-search {
  margin-top: 10px;
  background: #f0f0f0; border-radius: 10px;
  padding: 8px 14px; font-size: 14px; color: #999;
  display: flex; align-items: center; gap: 8px;
}
.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 0.5px solid #f0f0f0;
  cursor: pointer; position: relative;
}
.chat-item:active { background: #f5f5f5; }
.chat-item .cavatar {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.chat-item .cinfo { flex: 1; min-width: 0; }
.chat-item .cname { font-size: 15px; font-weight: 600; }
.chat-item .cpreview { font-size: 13px; color: var(--line-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chat-item .cmeta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.chat-item .ctime { font-size: 11px; color: var(--line-sub); }
.chat-item .cbadge {
  background: #ff3b30; color: white; font-size: 11px;
  font-weight: 600; border-radius: 10px; padding: 1px 7px; min-width: 20px; text-align: center;
}

/* 模型選擇（偽裝成通知）*/
#model-notice {
  background: #fffbe6; border-bottom: 0.5px solid #f0d060;
  padding: 10px 16px; display: flex; align-items: center; gap: 10px;
}
#model-select {
  flex: 1; background: white; border: 1px solid #e0e0e0;
  border-radius: 8px; padding: 6px 10px;
  font-family: inherit; font-size: 13px; color: var(--line-text);
  outline: none; cursor: pointer;
}
#enter-btn {
  background: var(--line-green); border: none; color: white;
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 16px; border-radius: 20px; cursor: pointer;
  white-space: nowrap;
}
#enter-btn:active { background: var(--line-green-dark); }

/* Gameover */
#gameover-overlay {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: flex-end; justify-content: center;
}
#gameover-overlay.show { display: flex; }
#gameover-sheet {
  background: white; border-radius: 20px 20px 0 0;
  padding: 24px 24px 40px; width: 100%; text-align: center;
}
#gameover-title { font-size: 32px; margin-bottom: 12px; }
#gameover-sub { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
#gameover-msg { font-size: 13px; color: var(--line-sub); line-height: 1.7; margin-bottom: 24px; }
#restart-btn {
  background: var(--line-green); border: none; color: white;
  font-family: inherit; font-size: 16px; font-weight: 600;
  padding: 14px; border-radius: 12px; cursor: pointer; width: 100%;
}
</style>
</head>
<body>
<div id="phone-frame">

  <!-- 開始畫面：LINE 聊天列表 -->
  <div id="start-screen">
    <div id="start-header">
      <h1>聊天</h1>
      <div id="start-search">🔍 搜尋</div>
    </div>
    <div id="model-notice">
      <span>🤖</span>
      <select id="model-select">
        <option value="qwen3.5:9b" selected>qwen3.5:9b ⚡ 建議</option>
        <option value="gemma4:e4b">gemma4:e4b 🔥 輕量</option>
        <option value="gemma4:26b">gemma4:26b 🧠 慢但準</option>
        <option value="qwen3.6:27b">qwen3.6:27b 👑 最強</option>
      </select>
      <button id="enter-btn" onclick="startGame()">上班去</button>
    </div>
    <div class="chat-list">
      <div class="chat-item" onclick="startGame()">
        <div class="cavatar" style="background:linear-gradient(135deg,#667eea,#764ba2)">👔</div>
        <div class="cinfo">
          <div class="cname">陳經理 - 專案討論</div>
          <div class="cpreview">關於這次的系統架構，我有幾個問題想確認一下</div>
        </div>
        <div class="cmeta">
          <div class="ctime">09:02</div>
          <div class="cbadge">3</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="cavatar" style="background:linear-gradient(135deg,#f093fb,#f5576c)">👩</div>
        <div class="cinfo">
          <div class="cname">王小美</div>
          <div class="cpreview">等一下有空嗎？想問你一個技術問題</div>
        </div>
        <div class="cmeta">
          <div class="ctime">昨天</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="cavatar" style="background:linear-gradient(135deg,#4facfe,#00f2fe)">👥</div>
        <div class="cinfo">
          <div class="cname">後端開發群組</div>
          <div class="cpreview">阿明：那個 bug 有人看了嗎</div>
        </div>
        <div class="cmeta">
          <div class="ctime">昨天</div>
          <div class="cbadge">12</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="cavatar" style="background:linear-gradient(135deg,#43e97b,#38f9d7)">🏢</div>
        <div class="cinfo">
          <div class="cname">公司公告</div>
          <div class="cpreview">本月績效評估將於月底進行，請各部門...</div>
        </div>
        <div class="cmeta">
          <div class="ctime">週一</div>
        </div>
      </div>
      <div class="chat-item">
        <div class="cavatar" style="background:linear-gradient(135deg,#fa709a,#fee140)">🤝</div>
        <div class="cinfo">
          <div class="cname">客戶 - 林先生</div>
          <div class="cpreview">上次討論的功能，時程上有辦法提前嗎？</div>
        </div>
        <div class="cmeta">
          <div class="ctime">週一</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Gameover -->
  <div id="gameover-overlay">
    <div id="gameover-sheet">
      <div id="gameover-title"></div>
      <div id="gameover-sub"></div>
      <div id="gameover-msg"></div>
      <button id="restart-btn" onclick="restartGame()">重新上班</button>
    </div>
  </div>

  <!-- 狀態列 -->
  <div id="status-bar">
    <div class="time" id="real-clock">9:00</div>
    <div class="icons">
      <span>📶</span><span>WiFi</span><span>🔋</span>
    </div>
  </div>

  <!-- 聊天標頭 -->
  <div id="chat-header">
    <div class="back">‹</div>
    <div class="avatar">👔<div class="online"></div></div>
    <div class="info">
      <div class="name">陳經理 - 專案討論</div>
      <div class="status" id="header-status">線上</div>
    </div>
    <div class="actions">
      <span>📞</span>
      <span>⋯</span>
    </div>
  </div>

  <!-- 數值列（偽裝成置頂公告）-->
  <div id="notice-bar">
    <div class="notice-icon">📌</div>
    <div class="stats">
      <div class="stat-item">
        <div class="slabel">⚡精力</div>
        <div class="sbar"><div class="sbar-fill" id="bar-energy" style="width:80%;background:#06C755"></div></div>
        <div class="sval" id="val-energy" style="color:#06C755">80</div>
      </div>
      <div class="stat-item">
        <div class="slabel">📊KPI</div>
        <div class="sbar"><div class="sbar-fill" id="bar-kpi" style="width:0%;background:#ff9500"></div></div>
        <div class="sval" id="val-kpi" style="color:#ff9500">0%</div>
      </div>
      <div class="stat-item">
        <div class="slabel">🎭偽裝</div>
        <div class="sbar"><div class="sbar-fill" id="bar-disguise" style="width:70%;background:#06C755"></div></div>
        <div class="sval" id="val-disguise" style="color:#06C755">70</div>
      </div>
      <div class="stat-item">
        <div class="slabel">🕐時間</div>
        <div class="sval" id="game-clock" style="color:#888;font-size:11px">09:00</div>
      </div>
    </div>
  </div>

  <!-- 聊天訊息區 -->
  <div id="chat-messages">
    <div class="date-divider">今天</div>
  </div>

  <!-- 輸入列 -->
  <div id="input-bar">
    <div class="icon-btn">＋</div>
    <textarea id="msg-input" rows="1" placeholder="輸入訊息..." disabled></textarea>
    <button id="send-btn" onclick="sendAction()" disabled>➤</button>
  </div>

</div>

<script>
const BASE = "https://spring-art-db47.twlin628.workers.dev";

let state = {
  energy: 80, kpi: 0, disguise: 70,
  gameTime: 9 * 60,
  model: "qwen3.5:9b",
  history: [], isOver: false, turnCount: 0,
};
let abortController = null;

const SYSTEM_PROMPT = `你是一個辦公室生存遊戲的旁白與裁判，同時扮演「陳經理」這個角色跟玩家對話。
介面偽裝成 LINE 聊天，所以你的回應要像真實的工作對話訊息，但內容是在判斷玩家的摸魚行為。

世界觀：玩家是一名資深工程師，目標是在下班前（18:00）把KPI做到60%以上，但同時要摸魚保留精力、裝忙維持偽裝值。

【三個核心數值】
- 精力(0~100)：做正事大量消耗，摸魚回復，歸零精神渙散被抓
- KPI進度(0~100)：做正事才上升，下班需>=60
- 偽裝值(0~100)：裝忙維持，太認真反而下降，歸零主管來盯

【行為對數值的影響】
認真工作、解決問題：KPI +10~+20, 精力 -15~-25, 偽裝值 -5~-15
摸魚（看影片、滑手機、發呆）：精力 +10~+20, KPI不動, 偽裝值 -10~-20
裝忙（假裝看code、開空白文件、敲鍵盤）：偽裝值 +10~+20, 精力 -5, KPI不動
喝咖啡、上廁所、茶水間：精力 +10~+15, 偽裝值微降
聰明行為（趁主管不在偷衝KPI）：KPI +5~+15, 精力 -5~-10

【回應格式】
用「陳經理」的口吻回覆，像 LINE 工作訊息（1~2句），內容要自然，不要讓人看出是遊戲。
偶爾加入主管巡邏、緊急需求、同事消息等突發事件。

嚴格只回傳JSON：
{
  "message": "陳經理說的話（1~2句，像真實工作LINE訊息）",
  "energy_delta": 數字,
  "kpi_delta": 數字,
  "disguise_delta": 數字,
  "event": "突發事件簡短描述或null",
  "gameover": false,
  "gameover_msg": "結局或null",
  "win": false,
  "win_msg": "成功結局或null",
  "time_advance": 15到40之間的數字
}`;

// 實時時鐘
function updateRealClock() {
  const now = new Date();
  document.getElementById('real-clock').textContent =
    now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
}
updateRealClock();
setInterval(updateRealClock, 30000);

// 自動調整輸入框高度
document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAction(); }
});

function startGame() {
  state.model = document.getElementById('model-select').value;
  document.getElementById('start-screen').style.display = 'none';
  updateStats();

  // 初始訊息
  sleep(500).then(() => {
    addBubble('other', '陳經理', '你好，今天有空嗎？想跟你確認一下這次系統架構的幾個細節。');
    sleep(800).then(() => {
      addBubble('other', '陳經理', '另外 KPI 這個月還差一些，你那邊進度怎麼樣？');
      sleep(600).then(() => {
        addSysMsg('💡 目標：下班前 KPI 達到 60%，同時保持精力和偽裝值');
        enableInput();
      });
    });
  });
}

async function sendAction() {
  const input = document.getElementById('msg-input');
  const action = input.value.trim();
  if (!action || state.isOver) return;

  input.value = '';
  input.style.height = 'auto';
  disableInput();
  addBubble('me', '', action);

  const userMsg = `當前狀態：精力${state.energy} KPI${state.kpi} 偽裝${state.disguise} 時間${formatTime(state.gameTime)} 回合${state.turnCount}
玩家行動：「${action}」`;

  state.history.push({ role: "user", content: userMsg });
  abortController = new AbortController();

  // 顯示打字中
  const typingRow = addTyping();
  document.getElementById('header-status').textContent = '輸入中...';

  try {
    const res = await fetch(BASE + "/api/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: abortController.signal,
      body: JSON.stringify({
        model: state.model,
        messages: [{ role: "system", content: SYSTEM_PROMPT }, ...state.history],
        stream: false,
      })
    });

    const data = await res.json();
    const raw = data.choices?.[0]?.message?.content ?? "{}";
    removeTyping(typingRow);
    document.getElementById('header-status').textContent = '線上';

    let parsed;
    try {
      const clean = raw.replace(/```json|```/g, '').trim();
      const s = clean.indexOf('{'), e = clean.lastIndexOf('}');
      parsed = JSON.parse(clean.slice(s, e + 1));
    } catch {
      addSysMsg('⚠ 系統錯誤，請再試一次');
      state.history.pop();
      enableInput();
      return;
    }

    state.history.push({ role: "assistant", content: raw });
    state.turnCount++;

    state.energy   = clamp(state.energy   + (parsed.energy_delta   || 0));
    state.kpi      = clamp(state.kpi      + (parsed.kpi_delta      || 0));
    state.disguise = clamp(state.disguise + (parsed.disguise_delta || 0));
    state.gameTime += (parsed.time_advance || 20);
    updateStats();

    await sleep(300);
    addBubble('other', '陳經理', parsed.message || '好的，我知道了。');

    if (parsed.event) {
      await sleep(600);
      addEventMsg('⚠ ' + parsed.event);
    }

    // 失敗
    if (parsed.gameover || state.energy <= 0 || state.disguise <= 0) {
      await sleep(800);
      let msg = parsed.gameover_msg;
      if (!msg && state.energy <= 0) msg = '精力耗盡，你整個人魂不守舍，陳經理走過來：「你今天還好嗎？」';
      if (!msg && state.disguise <= 0) msg = '偽裝值歸零，陳經理直接走到你旁邊：「你今天到底在做什麼？」';
      showGameover(false, msg || '遊戲結束。');
      return;
    }

    // 下班
    if (state.gameTime >= 18 * 60) {
      await sleep(800);
      if (state.kpi >= 60) {
        showGameover(true, parsed.win_msg || `完美！KPI ${state.kpi}%，準時下班，今天的摸魚藝術你做到了。`);
      } else {
        showGameover(false, `下班了，但 KPI 只有 ${state.kpi}%，陳經理叫你留下來開績效檢討會...`);
      }
      return;
    }

    if (parsed.win) { await sleep(800); showGameover(true, parsed.win_msg || '完美收工！'); return; }

    enableInput();

  } catch (e) {
    removeTyping(typingRow);
    document.getElementById('header-status').textContent = '線上';
    if (e.name === 'AbortError') {
      addSysMsg('已取消');
      state.history.pop();
    } else if (e.message.includes('524') || e.message.includes('timeout')) {
      addSysMsg('⚠ 回應逾時，建議改用 qwen3.5:9b');
      state.history.pop();
    } else {
      addSysMsg('⚠ 連線失敗：' + e.message);
      state.history.pop();
    }
    enableInput();
  } finally {
    abortController = null;
  }
}

// ── UI 工具 ──
function addBubble(side, name, text) {
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + side;

  const now = new Date();
  const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

  if (side === 'other') {
    row.innerHTML = `
      <div class="msg-avatar">👔</div>
      <div class="msg-content">
        <div class="msg-name">${name}</div>
        <div class="bubble">${escHtml(text)}</div>
        <div class="msg-meta"><span>${timeStr}</span></div>
      </div>`;
  } else {
    row.innerHTML = `
      <div class="msg-content">
        <div class="bubble">${escHtml(text)}</div>
        <div class="msg-meta"><span class="read-label">已讀</span><span>${timeStr}</span></div>
      </div>`;
  }
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function addSysMsg(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addEventMsg(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'event-msg';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById('chat-messages');
  const row = document.createElement('div');
  row.className = 'msg-row other';
  row.innerHTML = `
    <div class="msg-avatar">👔</div>
    <div class="msg-content">
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    </div>`;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return row;
}

function removeTyping(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

function showGameover(isWin, msg) {
  state.isOver = true;
  document.getElementById('gameover-title').textContent = isWin ? '🏆' : '💀';
  document.getElementById('gameover-sub').textContent = isWin ? '完美收工！' : '遊戲結束';
  document.getElementById('gameover-sub').style.color = isWin ? '#06C755' : '#ff3b30';
  document.getElementById('gameover-msg').textContent = msg;
  document.getElementById('gameover-overlay').classList.add('show');
}

function restartGame() {
  state = { energy:80, kpi:0, disguise:70, gameTime:9*60, model:state.model, history:[], isOver:false, turnCount:0 };
  document.getElementById('chat-messages').innerHTML = '<div class="date-divider">今天</div>';
  document.getElementById('gameover-overlay').classList.remove('show');
  document.getElementById('start-screen').style.display = 'flex';
  updateStats();
}

function updateStats() {
  const ec = state.energy   < 30 ? '#ff3b30' : state.energy   < 50 ? '#ff9500' : '#06C755';
  const kc = state.kpi      < 40 ? '#ff3b30' : state.kpi      < 60 ? '#ff9500' : '#06C755';
  const dc = state.disguise < 30 ? '#ff3b30' : state.disguise < 50 ? '#ff9500' : '#06C755';
  setBar('energy',   state.energy,   ec);
  setBar('kpi',      state.kpi,      kc);
  setBar('disguise', state.disguise, dc);
  document.getElementById('game-clock').textContent = formatTime(state.gameTime);
}

function setBar(name, val, color) {
  document.getElementById('bar-' + name).style.width = val + '%';
  document.getElementById('bar-' + name).style.background = color;
  const el = document.getElementById('val-' + name);
  el.textContent = name === 'kpi' ? val + '%' : val;
  el.style.color = color;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function formatTime(m) { return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function enableInput() {
  document.getElementById('msg-input').disabled = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}
function disableInput() {
  document.getElementById('msg-input').disabled = true;
  document.getElementById('send-btn').disabled = true;
}
</script>
